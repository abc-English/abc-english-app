name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Install dependencies
        run: |
          npm install
          npm install --save-dev @capacitor/assets

      - name: Add Android platform
        run: npx cap add android || echo "Android already exists"

      - name: Generate icons and splash
        if: hashFiles('resources/icon.png') != ''
        run: npx capacitor-assets generate --android --iconBackgroundColor "#3b82f6" --splashBackgroundColor "#3b82f6"

      - name: Copy google-services.json
        run: |
          mkdir -p android/app
          cp google-services.json android/app/google-services.json

      - name: Add google-services plugin
        run: |
          # Add classpath to project-level build.gradle
          if ! grep -q "google-services" android/build.gradle; then
            sed -i "/dependencies {/a\\        classpath 'com.google.gms:google-services:4.4.2'" android/build.gradle
          fi
          # Apply plugin in app-level build.gradle
          if ! grep -q "google-services" android/app/build.gradle; then
            echo "" >> android/app/build.gradle
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          fi

      - name: Copy web assets
        run: npx cap copy android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x ./android/gradlew

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: abc-english-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ABC English v1.0.${{ github.run_number }}
          body: |
            ## ABC English Android App

            Build number ${{ github.run_number }} - With Push Notifications!

            ### Installation
            1. Download app-debug.apk below
            2. Transfer to your Android phone
            3. Open the file and install
            4. Open the app and grant notification permission

            ### Features
            - Push notifications work even when phone is locked
            - Strong sound and vibration
            - Lesson reminders
            - Announcements from teacher
          files: android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
